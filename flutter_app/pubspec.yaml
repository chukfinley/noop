name: noop
description: "NOOP — recovery, sleep & strain tracker (Flutter port)."
publish_to: 'none'
# User-facing version only — NO `+buildNumber`. Android's mandatory versionCode
# (which must monotonically increase for in-place updates) is derived
# automatically from the clock in android/app/build.gradle.kts, so it never
# needs bumping and never appears in a public release.
version: 8.2.5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  animations: ^2.0.11
  flutter_secure_storage: ^9.2.2
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.40
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.0
  openfoodfacts: ^3.30.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  flutter_blue_plus: ^2.3.10
  bluetooth_low_energy: ^6.2.1
  sensors_plus: ^6.1.0
  flutter_foreground_task: ^9.2.2
  workmanager: ^0.9.0+3
  # Data portability: import a Kotlin/Apple NOOP backup + export our own `.noopbak`.
  archive: ^4.0.2 # pure-Dart zip (read/write the .noopbak container)
  file_picker: ^8.1.6 # pick a backup file to import (SAF on Android)
  share_plus: ^10.1.4 # share/save the exported .noopbak out of the app
  flutter_svg: ^2.0.10+1 # render the bundled NOOP vector logos in-app
  package_info_plus: ^8.0.0 # show the real app version in About (no build number)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.1 # generate the app launcher icon from the NOOP logo

# App launcher icon — the blue NOOP mark (matches the app's blue accent). Run with
# `dart run flutter_launcher_icons` after changing the source PNG.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/noop_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1622"
  adaptive_icon_foreground: "assets/icon/noop_icon.png"

flutter:
  uses-material-design: true
  assets:
    # NOTE: assets/data/real_raw.bin.gz is intentionally NOT bundled — the app is
    # live-only and never reads it at runtime (17.5 MB of dead APK weight). It stays
    # on disk and is loaded by the pipeline regression tests via File I/O.
    - assets/images/wallpaper.jpg
    - assets/logos/
