name: noop
description: "NOOP — recovery, sleep & strain tracker (Flutter port)."
publish_to: 'none'
version: 8.1.0+169

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  animations: ^2.0.11
  flutter_secure_storage: ^9.2.2
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.40
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.0
  openfoodfacts: ^3.30.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  flutter_blue_plus: ^2.3.10
  bluetooth_low_energy: ^6.2.1
  sensors_plus: ^6.1.0
  flutter_foreground_task: ^9.2.2
  workmanager: ^0.9.0+3
  # Data portability: import a Kotlin/Apple NOOP backup + export our own `.noopbak`.
  archive: ^4.0.2 # pure-Dart zip (read/write the .noopbak container)
  file_picker: ^8.1.6 # pick a backup file to import (SAF on Android)
  share_plus: ^10.1.4 # share/save the exported .noopbak out of the app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/data/real_raw.bin.gz
    - assets/images/wallpaper.jpg
